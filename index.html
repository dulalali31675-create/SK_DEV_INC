<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login with Google</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  background:#f2f2f2;
}

.card{
  background:#fff;
  padding:25px;
  border-radius:12px;
  width:90%;
  max-width:320px;
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

button{
  width:100%;
  padding:12px;
  font-size:16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.google{
  background:#4285F4;
  color:#fff;
}

.user{
  margin-top:15px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="card">
  <h2>Welcome</h2>
  <p>Login using Google</p>

  <button class="google" onclick="googleLogin()">
    🔐 Sign in with Google
  </button>

  <div class="user" id="userInfo"></div>
</div>

<script>
  // 🔥 Replace with YOUR Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyCtlRprj3G6MamvWjMceVD3SsgD-1OG378",
    authDomain: "project-ffcf9.firebaseapp.com",
    projectId: "project-ffcf9"
  };

  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const provider = new firebase.auth.GoogleAuthProvider();

  function googleLogin(){
    auth.signInWithPopup(provider)
      .then((result)=>{
        const user = result.user;
        document.getElementById("userInfo").innerHTML =
          "Logged in as <br><b>" + user.displayName + "</b><br>" + user.email;
      })
      .catch((error)=>{
        alert(error.message);
      });
  }
</script>

</body>
</html>
