<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Google Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase SDK (COMPAT – HTML ke liye best) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#f1f3f4;
  font-family:Arial, sans-serif;
}
.box{
  background:#fff;
  padding:25px;
  width:90%;
  max-width:330px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);
}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#4285F4;
  color:white;
  font-size:16px;
  cursor:pointer;
}
#user{
  margin-top:15px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="box">
  <h2>Welcome</h2>
  <p>Login with Google</p>

  <button onclick="loginGoogle()">Sign in with Google</button>

  <div id="user"></div>
</div>

<script>
  // 🔥 Firebase Configuration (YOUR DATA)
  const firebaseConfig = {
    apiKey: "AIzaSyCtlRprj3G6MamvWjMceVD3SsgD-1OG378",
    authDomain: "project-ffcf9.firebaseapp.com",
    projectId: "project-ffcf9",
    storageBucket: "project-ffcf9.firebasestorage.app",
    messagingSenderId: "857198848706",
    appId: "1:857198848706:web:5e12872cdd473805e3295b"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const provider = new firebase.auth.GoogleAuthProvider();

  function loginGoogle(){
    auth.signInWithPopup(provider)
    .then((result)=>{
      const user = result.user;
      document.getElementById("user").innerHTML =
        "<b>" + user.displayName + "</b><br>" + user.email;
    })
    .catch((error)=>{
      alert(error.message);
    });
  }
</script>

</body>
</html>
